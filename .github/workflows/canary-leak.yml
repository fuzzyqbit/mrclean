name: Canary Leak Gate

on:
  push:
    # gsd/** lets milestone branches fire the wire-safety gates on ubuntu
    # BEFORE the merge PR (Plan 11-06, A4 retirement). PR gating stays main-only.
    branches: [main, 'gsd/**']
  pull_request:
    branches: [main]
  # Durable post-merge affordance: re-run the gate on demand from any branch.
  workflow_dispatch:

# Cancel in-progress runs for the same branch. This workflow has no write
# permissions and uses no secrets — it is a read-only security gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary-leak:
    runs-on: ubuntu-latest
    # 10 minutes is 5x the expected ~2 min wall time (build + fixtures corpus run)
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run fixture corpus (positive recall + negative FP rate + audit canary-leak)
        # Runs tests/fixtures-corpus.test.ts (100% recall on 12 positive fixtures,
        # 0 FP on 10 negative fixtures, and assertNoCanaryLeak on audit.jsonl) plus
        # tests/fixtures-corpus-bundle.test.ts (Layer 1 bundle smoke test).
        # Both files run via the integration project (fileParallelism:false) so the
        # tsup dist/ build is present before tests import from it.
        run: npx vitest run --project=integration tests/fixtures-corpus.test.ts tests/fixtures-corpus-bundle.test.ts

      - name: Defense-in-depth grep — no fixture-secret value appears in any audit log
        # If tests/fixtures-corpus.test.ts created .mrclean/audit.jsonl, scan it
        # for any positive-fixture secret values. The test itself asserts this
        # via assertNoCanaryLeak; this step is a belt-and-suspenders second pass
        # that catches any future test-bug where the in-test assertion is
        # silenced or skipped. Read every positive fixture; grep each value
        # against every .mrclean/audit*.jsonl file in the repo.
        run: |
          set -e
          if [ -d .mrclean ]; then
            for f in tests/fixtures/positive/*.txt; do
              val="$(cat "$f")"
              # Skip empty or very short fixtures (would false-match)
              if [ "${#val}" -lt 8 ]; then continue; fi
              # Grep against any audit.jsonl files
              if grep -F "$val" .mrclean/audit*.jsonl 2>/dev/null; then
                echo "::error::Canary leak: $f value found in audit log"
                exit 1
              fi
            done
          fi
          echo "Defense-in-depth canary-leak grep passed."

      - name: Run PII canary-leak proof (full NER-on pipeline → audit.jsonl)
        # Plan 07-03 (PIISEC-01 CI gate): runs 07-01's PII leak test, which feeds a
        # synthetic PII canary corpus (SSN/email/name/card) through the full detection
        # pipeline with NER on and asserts assertNoCanaryLeak over the audit log. Runs
        # in the integration project so the tsup dist/ build is present.
        run: npx vitest run --project=integration tests/audit/pii-canary-leak.test.ts

      - name: Defense-in-depth grep — no synthetic PII canary appears in any audit log
        # Belt-and-suspenders second pass mirroring the secret grep above: for each
        # synthetic PII canary value (the 07-01 PII_CANARIES set), grep against every
        # .mrclean/audit*.jsonl in the repo. The vitest test asserts this via
        # assertNoCanaryLeak; this step catches any future test-bug where that
        # assertion is silenced or skipped.
        run: |
          set -e
          PII_CANARIES=(
            "457-55-5462"
            "zzcanary.person@example.invalid"
            "Zebediah Quux-Canary"
            "4000-0000-0000-0002"
          )
          if [ -d .mrclean ]; then
            for val in "${PII_CANARIES[@]}"; do
              if grep -F "$val" .mrclean/audit*.jsonl 2>/dev/null; then
                echo "::error::PII canary leak: '$val' found in audit log"
                exit 1
              fi
            done
          fi
          echo "Defense-in-depth PII canary-leak grep passed."

      - name: Wire-safety gates — REVMODE-11 (SC2/SC3 unit + SC1a/SC4 integration)
        # Plan 11-06 (SC3/SC4 elevation): every wire-safety suite is NAMED here so a
        # routing regression cannot silently drop a gate from CI. The exact-count
        # "Test Files N passed" grep is the anti-vacuity guard: `npx vitest run
        # <file> --project=X` exits 0 with ZERO files collected when the file is
        # not in project X's include list (demonstrated in-repo, 10-07) — a
        # mis-routed file changes the collected count and fails the step even
        # though vitest exits 0.
        #
        # `set -o pipefail` as the FIRST line is load-bearing and applies to both
        # pipelines below: GitHub Actions runs plain `run:` steps with `bash -e {0}`
        # — NO pipefail unless the step sets `shell: bash` — so without it a
        # non-zero vitest exit whose output still contains an intact
        # "Test Files N passed" line (e.g. a teardown or unhandled-rejection
        # failure) would pass the guard silently.
        #
        # The integration pipeline runs after the npm ci + npm run build steps
        # above; the integration project's globalSetup owns the tsup rebuild, so
        # dist/ is guaranteed fresh for dist-parity + stress.
        run: |
          set -o pipefail
          npx vitest run --project=unit tests/audit/restore-canary-leak.test.ts tests/state/chaos.test.ts tests/state/fs-interception.test.ts | tee /dev/stderr | grep -Eq "Test Files\s+3 passed"
          npx vitest run --project=integration tests/hook/dist-parity.test.ts tests/state/stress.test.ts | tee /dev/stderr | grep -Eq "Test Files\s+2 passed"

      - name: Defense-in-depth grep — reversible canary corpus
        # Plan 11-06: belt-and-suspenders second pass mirroring the secret + PII
        # greps above, over the pinned 10-08 reversible canary corpus (word,
        # email, non-EXAMPLE AWS key). The wire-safety suites assert absence via
        # assertNoCanaryLeak and byte-scans; this step catches any future
        # test-bug where those assertions are silenced or skipped. Values are
        # synthetic markers pinned for exactly this purpose (T-11-06-03) —
        # printed only on FAILURE.
        run: |
          set -e
          REVERSIBLE_CANARIES=(
            "zz-canary-project-path-7g2"
            "kim.canary@zz.invalid"
            "AKIAIOSFODNN7EXAMPLX"
          )
          if [ -d .mrclean ]; then
            for val in "${REVERSIBLE_CANARIES[@]}"; do
              if grep -F "$val" .mrclean/audit*.jsonl 2>/dev/null; then
                echo "::error::Reversible canary leak: '$val' found in audit log"
                exit 1
              fi
            done
          fi
          echo "Defense-in-depth reversible canary-leak grep passed."
