name: Test

on:
  push:
    # gsd/** lets milestone branches fire the full matrix on ubuntu BEFORE the
    # merge PR — the stress gate's first ubuntu run must not be the milestone
    # PR itself (Plan 11-06, A4 retirement). PR gating stays main-only.
    branches: [main, 'gsd/**']
  pull_request:
    branches: [main]
  # Durable post-merge affordance: re-run the matrix on demand from any branch.
  workflow_dispatch:

# Cancel in-progress runs for the same branch so successive pushes don't queue
# redundant test runs. This workflow has no write permissions and uses no secrets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 15 minutes is 3x the expected ~5 min wall time (build + test + coverage)
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Floor pin is 20.19 (not the package.json-historical 20.18) because
        # vitest -> vite@8 -> rolldown's native bindings carry
        # engines.node: "^20.19.0 || >=22.12.0"; npm silently marks the
        # optional binding inert below that floor (no install, no error),
        # so 20.18 could never actually pass this toolchain. Verified via
        # rolldown-binding-node2018-engines debug session, 2026-07-18.
        node-version: ['20.19', '20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: QA-02 enforcement — integration tests cover every HOOK-01 event
        run: |
          EVENTS="SessionStart UserPromptSubmit PreToolUse PostToolUse"
          for ev in $EVENTS; do
            if ! grep -q "@hook-integration.*$ev" tests/hook/integration-detection.test.ts; then
              echo "::error::QA-02 missing integration coverage tag for hook event: $ev"
              exit 1
            fi
          done
          echo "QA-02 enforcement passed."

      - name: Coverage with thresholds
        # Run coverage on one matrix slot only to avoid 3x redundant V8 overhead.
        # Node 20.x is the primary signal slot; 20.18 tests the floor; 22.x tests
        # forward compat. V8 coverage adds ~30% to test runtime — running once is enough.
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
